name: Deploy 每日知識庫 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git 歷史用來判斷文章日期
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Add admin & LINE files
        run: cp -r site-extra/. public/
      - name: Cache GenSen Rounded font
        id: font-cache
        uses: actions/cache@v4
        with:
          path: fonts-src
          key: gensen-rounded-2-tw-r-b-v1
      - name: Download GenSen Rounded font (SIL OFL 1.1)
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts-src
          for w in R B; do
            curl -fsSL -o fonts-src/GenSenRounded2TW-$w.otf \
              https://raw.githubusercontent.com/ButTaiwan/gensen-font/master/otf/TW/GenSenRounded2TW-$w.otf
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Subset font to characters used on the site
        run: |
          pip install --quiet fonttools brotli
          python scripts/subset_fonts.py fonts-src public
          cp fonts-LICENSE-GenSen-OFL.txt public/static/fonts/OFL.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
